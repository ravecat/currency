name: release

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Check and build application
    runs-on: ubuntu-24.04
    env:
      CI: "true"
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false

      - name: Install dependencies
        run: just setup

      - name: Check repository
        run: just check

      - name: Run browser tests
        id: browser-tests
        run: just test --maxWorkers=1 --no-file-parallelism

      - name: Build application and Storybook
        run: just build

      - name: Upload visual failure evidence
        if: failure() && steps.browser-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: visual-failure-evidence
          path: .vitest-attachments/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Build and push application image
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.event.repository.name }}
          cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}
          platforms: linux/amd64
